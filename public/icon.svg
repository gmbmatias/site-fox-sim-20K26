<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foxCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7efff5" />
      <stop offset="50%" stop-color="#4fe3db" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="foxDeepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a4f" />
      <stop offset="100%" stop-color="#061c28" />
    </linearGradient>
    <linearGradient id="foxMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5b78" />
      <stop offset="100%" stop-color="#0d3244" />
    </linearGradient>
    <linearGradient id="foxCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#4fe3db" />
    </linearGradient>
    <linearGradient id="foxBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091c2b" />
      <stop offset="100%" stop-color="#040b12" />
    </linearGradient>
    <filter id="foxNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Neon Cyan Border -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#foxBgGrad)" stroke="#4fe3db" stroke-width="2.5" />

  <!-- Subtle HUD Radar Rings -->
  <circle cx="50" cy="50" r="38" stroke="#4fe3db" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" />
  <circle cx="50" cy="50" r="24" stroke="#4fe3db" stroke-width="1" opacity="0.15" />

  <!-- Outer Fox Ears / Canted Jet Stabilizers -->
  <polygon points="50,22 18,14 26,48 42,40" fill="url(#foxCyanGrad)" />
  <polygon points="50,22 82,14 74,48 58,40" fill="url(#foxCyanGrad)" />

  <!-- Inner Ear / Shadow Facet -->
  <polygon points="50,26 26,20 32,44 46,38" fill="url(#foxDeepGrad)" />
  <polygon points="50,26 74,20 68,44 54,38" fill="url(#foxMidGrad)" />

  <!-- Cheeks / Swept Delta Wings -->
  <polygon points="14,46 44,70 34,50" fill="url(#foxCyanGrad)" />
  <polygon points="86,46 56,70 66,50" fill="url(#foxCyanGrad)" />

  <!-- Lateral Wing Shadow Plates -->
  <polygon points="14,46 34,50 40,64 26,62" fill="url(#foxDeepGrad)" />
  <polygon points="86,46 66,50 60,64 74,62" fill="url(#foxMidGrad)" />

  <!-- Supersonic Fox Snout / Jet Fuselage Core -->
  <polygon points="50,32 38,58 50,86 62,58" fill="url(#foxCoreGrad)" filter="url(#foxNeonGlow)" />
  <polygon points="50,32 50,86 62,58" fill="#00b4d8" opacity="0.35" />

  <!-- Sleek Fox Eyes / Cockpit HUD Sensors -->
  <polygon points="36,46 44,52 38,54" fill="#ffffff" />
  <polygon points="64,46 56,52 62,54" fill="#ffffff" />

  <!-- Glowing Nose Beacon Point -->
  <circle cx="50" cy="84" r="2.5" fill="#ffffff" />
  <circle cx="50" cy="84" r="4.5" fill="none" stroke="#7efff5" stroke-width="1" opacity="0.8" />
</svg>
